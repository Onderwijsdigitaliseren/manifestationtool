<script>
(function(){
  const r = window.ROUTES["kompas"];
  document.getElementById("rNaam").textContent = r.naam;
  document.getElementById("rEssence").textContent = "\u201C" + r.essence + "\u201D";
  document.getElementById("rUitleg").textContent = r.uitleg;
  document.getElementById("exTitle").textContent = "Oefening \u00B7 " + r.ex.title + " \u00B7 \u00B13 min";

  const count = document.getElementById("exCount");
  const text = document.getElementById("exText");
  const choices = document.getElementById("exChoices");
  const actions = document.getElementById("exActions");
  let step = -1;

  function render(){
    const total = r.ex.steps.length + 1;
    choices.hidden = true; actions.innerHTML = "";
    if(step < 0){
      count.textContent = "";
      text.textContent = "Drie stappen, \u00E9\u00E9n keuze. Neem er even de tijd voor.";
      const b = document.createElement("button");
      b.className = "btn-gold"; b.textContent = "Begin de oefening";
      b.addEventListener("click", function(){ step = 0; render(); });
      actions.appendChild(b);
    } else if(step < r.ex.steps.length){
      count.textContent = "Stap " + (step+1) + " van " + total;
      text.textContent = r.ex.steps[step];
      if(step > 0){
        const back = document.createElement("button");
        back.className = "btn-line"; back.textContent = "Terug";
        back.addEventListener("click", function(){ step--; render(); });
        actions.appendChild(back);
      }
      const next = document.createElement("button");
      next.className = "btn-gold"; next.textContent = "Volgende";
      next.addEventListener("click", function(){ step++; render(); });
      actions.appendChild(next);
    } else {
      count.textContent = "Tot slot";
      text.textContent = r.ex.choiceQ;
      choices.innerHTML = "";
      r.ex.choices.forEach(function(c){
        const b = document.createElement("button");
        b.className = "opt pill-opt"; b.style.animation = "none"; b.textContent = c;
        b.addEventListener("click", function(e){
          V.saveItem("Oefening \u00B7 " + r.naam, r.ex.title + " \u2014 " + c);
          V.toast("Mooi. Het staat in Mijn ruimte.");
          if(!V.isCalm()) V.dust.burst(e.clientX, e.clientY);
          step = -1; render();
        });
        choices.appendChild(b);
      });
      choices.hidden = false;
    }
  }
  render();
  if(location.hash === "#oefening"){
    document.getElementById("oefening").scrollIntoView({behavior:"auto", block:"center"});
  }
})();
</script>
